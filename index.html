<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>select</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://avatars.githubusercontent.com/u/1164760?v=4">
    <style>
      :root {
        --bg: #0d0d0f;
        --fg: #e8e8ea;
        --muted: #8a8a92;
        --accent: #7fd1b9;
        --line: #1e1e22;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #1a1a1c;
          --muted: #6a6a72;
          --accent: #2a8c70;
          --line: #e4e4e7;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }
      header {
        text-align: center;
        margin-bottom: 56px;
      }
      header img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: block;
        margin: 0 auto 16px;
        object-fit: cover;
        border: 2px solid var(--line);
        padding: 3px;
        background: var(--bg);
      }
      header h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header p {
        color: var(--muted);
        margin: 6px 0 0;
        font-size: 15px;
      }
      a { color: var(--accent); }
      header a { text-decoration: none; }
      header a:hover { text-decoration: underline; }

      .dot-bot {
        margin-bottom: 56px;
      }
      .dot-bot figure { margin: 0; }
      .dot-bot-photo {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .dot-bot h2,
      .projects h2 {
        margin: 20px 0 4px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .dot-bot figcaption {
        color: var(--muted);
        font-size: 14px;
      }
      .dot-bot figcaption a { text-underline-offset: 3px; }
      .related-label {
        margin: 24px 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .related-repos {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .related-repos li {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .related-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .related-repos a { text-decoration: none; }
      .related-repos a:hover { text-decoration: underline; }
      .tool-link {
        font-size: 14px;
        font-weight: 600;
      }
      .github-link {
        display: inline-flex;
        flex: 0 0 auto;
        color: var(--muted);
      }
      .github-link:hover { color: var(--accent); }
      .github-link svg { width: 17px; height: 17px; fill: currentColor; }
      .related-repos span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .projects h2 { margin: 0 0 12px; }
      @media (max-width: 560px) {
        .wrap { padding-top: 40px; }
        header { margin-bottom: 40px; }
        .related-repos { grid-template-columns: 1fr; }
      }

      ul.repos { list-style: none; margin: 0; padding: 0; }
      ul.repos li { border-top: 1px solid var(--line); }
      ul.repos li:last-child { border-bottom: 1px solid var(--line); }
      a.repo {
        display: block;
        padding: 16px 4px;
        text-decoration: none;
        color: inherit;
      }
      a.repo:hover { background: var(--line); }
      .repo-top {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .repo-name { font-weight: 600; color: var(--accent); }
      .repo-meta { color: var(--muted); font-size: 13px; }
      .repo-desc { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
      .loading { color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a href="https://github.com/select"><img src="https://avatars.githubusercontent.com/u/1164760?v=4" alt="select"></a>
        <h1>I AM SELECT</h1>
      </header>

      <section class="dot-bot" aria-labelledby="dot-bot-title">
        <figure>
          <img class="dot-bot-photo" src="img/dot-bot-maker-fair-26.jpg" alt="The Dot-Bot drawing robot at Maker Faire 2026">
          <h2 id="dot-bot-title">Dot-Bot at Maker Faire 2026</h2>
          <figcaption>
            A project by the Dot-Bot team with collaborators
            <a href="https://olivier.berlin/">olivier.berlin</a> and
            <a href="https://jaschamueller.art/">jaschamueller.art</a>.
          </figcaption>
        </figure>

        <h3 class="related-label">Related repositories</h3>
        <ul class="related-repos">
          <li>
            <div class="related-top">
              <a class="tool-link" href="https://select.github.io/ffito/">ffito</a>
              <a class="github-link" href="https://github.com/select/ffito" aria-label="ffito repository on GitHub" title="GitHub repository">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.4-5.5-6A4.7 4.7 0 0 1 6 9.7c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.3a11.5 11.5 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.7 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.3 3.3c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .7Z"/></svg>
              </a>
            </div>
            <span>SVG hatch-fill editor for pen plotters</span>
          </li>
          <li>
            <div class="related-top">
              <a class="tool-link" href="https://select.github.io/spiralux/">spiralux</a>
              <a class="github-link" href="https://github.com/select/spiralux" aria-label="spiralux repository on GitHub" title="GitHub repository">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.4-5.5-6A4.7 4.7 0 0 1 6 9.7c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.3a11.5 11.5 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.7 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.3 3.3c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .7Z"/></svg>
              </a>
            </div>
            <span>Bezier path editor and spiral generator</span>
          </li>
          <li>
            <div class="related-top">
              <a class="tool-link" href="https://select.github.io/cybermaze/">cybermaze</a>
              <a class="github-link" href="https://github.com/select/cybermaze" aria-label="cybermaze repository on GitHub" title="GitHub repository">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.4-5.5-6A4.7 4.7 0 0 1 6 9.7c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.3 1.3a11.5 11.5 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.7 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.3 3.3c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .7Z"/></svg>
              </a>
            </div>
            <span>Maze generator with SVG export</span>
          </li>
        </ul>
      </section>

      <section class="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">More projects</h2>
        <ul class="repos" id="repos"><li class="loading">loading repos…</li></ul>
      </section>
    </div>

    <script>
      const list = document.getElementById('repos');
      const hidden = new Set(['matrix-bookmarks', 'Angular2-ES6-Babel-Browserify-Starter', 'soeren-music', 'FLISELab', 'pr0tv', 'select.github.io', 'ffito', 'spiralux', 'cybermaze']);
      fetch('https://api.github.com/users/select/repos?per_page=100&sort=updated')
        .then(r => r.json())
        .then(repos => {
          repos = repos.filter(r => !r.fork && !hidden.has(r.name));
          repos.sort((a, b) => b.stargazers_count - a.stargazers_count);
          list.innerHTML = '';
          for (const r of repos) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'repo';
            a.href = r.html_url;
            const meta = [];
            if (r.language) meta.push(r.language);
            if (r.stargazers_count) meta.push('★ ' + r.stargazers_count);
            a.innerHTML =
              '<div class="repo-top">' +
                '<span class="repo-name">' + r.name + '</span>' +
                (meta.length ? '<span class="repo-meta">' + meta.join(' · ') + '</span>' : '') +
              '</div>' +
              (r.description ? '<div class="repo-desc">' + r.description.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>' : '');
            li.appendChild(a);
            list.appendChild(li);
          }
        })
        .catch(() => { list.innerHTML = '<li class="loading">could not load repos</li>'; });
    </script>
  </body>
</html>
